<svg xmlns="http://www.w3.org/2000/svg" width="900" height="78" viewBox="0 0 900 78" role="img" aria-labelledby="title desc"><title id="title">Building full-stack apps and practical AI tools</title><desc id="desc">Animated introduction: building full-stack web apps, exploring practical AI tools, open to internships and freelance collaboration.</desc><style>.line{opacity:0;animation:show 12s infinite}.two{animation-delay:4s}.three{animation-delay:8s}@keyframes show{0%,30%{opacity:1}33%,100%{opacity:0}}.cursor{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.line{animation:none}.one{opacity:1}.cursor{animation:none}}</style><rect width="900" height="78" rx="15" fill="#11172b"/><g font-family="monospace" font-size="23" text-anchor="middle" fill="#b7adff"><text class="line one" x="450" y="47">&gt; Building full-stack web apps.</text><text class="line two" x="450" y="47">&gt; Exploring practical AI tools.</text><text class="line three" x="450" y="47">&gt; Open to internships + freelance collaboration.</text></g><rect class="cursor" x="858" y="27" width="3" height="25" fill="#77e5c4"/></svg>